<section class="register-page">
  <div class="container">
    <div class="register-card">

      <div class="register-header">
        <span class="register-label">GET STARTED</span>

        <h1>Create your RailReserve account</h1>

        <p>
          Register to manage your bookings and reserve your journey.
        </p>
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger">
          {{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="register()">

        <div class="mb-3">
          <label
            for="name"
            class="form-label">
            Full Name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            [(ngModel)]="name"
            placeholder="Enter your full name"
            autocomplete="name">
        </div>

        <div class="mb-3">
          <label
            for="email"
            class="form-label">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email">
        </div>

        <div class="mb-3">
          <label
            for="phoneNumber"
            class="form-label">
            Phone Number
          </label>

          <input
            id="phoneNumber"
            name="phoneNumber"
            type="tel"
            class="form-control"
            [(ngModel)]="phoneNumber"
            placeholder="Enter your phone number"
            autocomplete="tel">
        </div>

        <div class="mb-3">
          <label
            for="password"
            class="form-label">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            [(ngModel)]="password"
            placeholder="Create a password"
            autocomplete="new-password">
        </div>

        <div class="mb-4">
          <label
            for="confirmPassword"
            class="form-label">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            class="form-control"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password">
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="isLoading">

          @if (isLoading) {
            Creating account...
          } @else {
            Create Account
          }

        </button>

      </form>

      <div class="register-footer">
        <span>Already have an account?</span>

        <a routerLink="/login">
          Sign in
        </a>
      </div>

    </div>
  </div>
</section>
